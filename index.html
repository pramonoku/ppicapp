<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>PPICapp</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#064e3b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PPICapp">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{--bg:#064e3b}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);overscroll-behavior:none}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
  /* #shell (div, bukan iframe) meregang penuh sampai tepi layar. Hanya sisi atas diberi jarak status bar;
     bagian bawah sengaja dibiarkan penuh agar tidak ada pita kosong di bawah. */
  #shell{position:fixed;top:0;left:0;right:0;bottom:0;box-sizing:border-box;background:var(--bg);
    padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
  #frame{display:block;width:100%;height:100%;border:0;background:#fff}
  #splash,#offline{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:var(--bg);z-index:10;text-align:center;padding:24px;transition:opacity .35s ease}
  #splash.hide{opacity:0;pointer-events:none}
  #splash img{width:112px;height:112px;border-radius:50%;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  #splash b{font-size:22px;letter-spacing:.3px}
  #splash small{opacity:.75;font-size:13px}
  .spin{width:30px;height:30px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#34d399;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  #offline{display:none;z-index:11}
  #offline.show{display:flex}
  button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:12px 22px;background:#10b981;color:#fff;cursor:pointer}
  #hint{display:none;max-width:320px;font-size:13px;opacity:.85;line-height:1.5}
  #pdfModal{display:none;position:fixed;inset:0;z-index:40;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.6)}
  #pdfModal.show{display:flex}
  .pdf-card{width:100%;max-width:360px;padding:22px 20px 18px;border-radius:22px;background:#fff;color:#0f2540;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.45)}
  .pdf-ico{width:64px;height:64px;margin:0 auto 12px;border-radius:16px;display:grid;place-items:center;background:#fee2e2;color:#b91c1c;font-weight:800;font-size:18px}
  .pdf-card b{display:block;font-size:16px;overflow-wrap:anywhere}
  .pdf-card small{display:block;margin-top:2px;color:#64748b;font-size:13px}
  .pdf-actions{display:grid;gap:10px;margin-top:16px}
  .pdf-actions button{padding:13px 22px;font-size:15px}
  .pdf-actions button.alt{background:#eef2f6;color:#0f2540}
  #pdfMsg{min-height:18px;margin-top:10px;font-size:13px;color:#b91c1c}
  #dbg{display:none;position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:20;background:rgba(0,0,0,.82);
    color:#d1fae5;font:12px/1.5 ui-monospace,Menlo,monospace;padding:10px 12px;border-radius:10px;white-space:pre-wrap}
</style>
</head>
<body>
<div id="shell"><iframe id="frame" title="PPICapp" allow="clipboard-write; fullscreen" referrerpolicy="origin"></iframe></div>

<div id="splash">
  <img src="icons/logo-256.png" alt="">
  <b>PPICapp</b>
  <div class="spin" aria-hidden="true"></div>
  <small id="splashMsg">Memuat aplikasi…</small>
  <div id="hint">Layar tidak muncul? Pastikan koneksi internet aktif, lalu coba muat ulang.</div>
  <button id="reloadBtn" style="display:none" type="button">Muat ulang</button>
</div>
<div id="offline">
  <b style="font-size:20px">Tidak ada koneksi internet</b>
  <small style="opacity:.8">Aplikasi akan dimuat otomatis begitu internet kembali.</small>
  <button id="retryBtn" type="button">Coba lagi</button>
</div>
<div id="pdfModal"><div class="pdf-card"><div class="pdf-ico">PDF</div><b id="pdfName">laporan.pdf</b><small id="pdfSize"></small><div class="pdf-actions"><button id="pdfShare" type="button">Bagikan PDF</button><button id="pdfOpen" class="alt" type="button">Buka PDF</button><button id="pdfClose" class="alt" type="button">Tutup</button></div><div id="pdfMsg"></div></div></div>
<div id="dbg"></div>

<script>
(function(){
  'use strict';
  /* ====== PENGATURAN ====== */
  var EXEC_URL = 'https://script.google.com/macros/s/AKfycbzNWY92QMYdAAhNpDn3AncpbNVnRKkM-LMKk4Iw15B4d9ezgoPDx_YlzybJomgveran/exec';
  var TOKEN_KEY = 'ppicapp.session.v1';
  /* ======================== */

  var frame = document.getElementById('frame');
  var splash = document.getElementById('splash');
  var offline = document.getElementById('offline');
  var dbg = document.getElementById('dbg');
  var DEBUG = /[?&]debug=1\b/.test(location.search);
  var log = [];
  function note(s){ if(!DEBUG) return; log.push(new Date().toLocaleTimeString()+'  '+s); if(log.length>7) log.shift(); dbg.style.display='block'; dbg.textContent=log.join('\n'); }

  /* ---- penyimpanan token (first-party di domain pembungkus, tidak diblokir iOS) ---- */
  function getToken(){ try{ return localStorage.getItem(TOKEN_KEY)||''; }catch(e){ return ''; } }
  function setToken(t){ try{ localStorage.setItem(TOKEN_KEY,t); }catch(e){} }
  function clearToken(){ try{ localStorage.removeItem(TOKEN_KEY); }catch(e){} }
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}

  /* ---- kirim token ke aplikasi: iframe Google bersarang, jadi pesan dikirim ke semua frame turunan ---- */
  function isStandalone(){ try{ return (window.navigator && window.navigator.standalone===true) || (window.matchMedia && matchMedia('(display-mode: standalone)').matches); }catch(e){ return false; } }
  function frameWindows(){
    var out=[];
    try{
      var cw=frame.contentWindow; out.push(cw);
      for(var i=0;i<cw.length;i++){
        var c=cw.frames[i]; out.push(c);
        try{ for(var j=0;j<c.length;j++) out.push(c.frames[j]); }catch(e){}
      }
    }catch(e){}
    return out;
  }
  function sendInit(){
    var msg={source:'ppicwrap',type:'init',token:getToken(),standalone:isStandalone(),base:location.origin+location.pathname.replace(/[^\/]*$/,'')};
    frameWindows().forEach(function(w){ try{ w.postMessage(msg,'*'); }catch(e){} });
  }

  /* ---- PDF dari aplikasi: ditampilkan di sini (jendela paling luar) agar tombol Bagikan iPhone diizinkan ---- */
  var pdfFile = null;
  function showPdf(d){
    try{
      var tag = Object.prototype.toString.call(d.buffer);
      if(tag !== '[object ArrayBuffer]' || d.buffer.byteLength > 30000000) return;
      pdfFile = new File([d.buffer], String(d.filename||'laporan.pdf').replace(/[^\w.\- ]+/g,'_'), {type:'application/pdf'});
      document.getElementById('pdfName').textContent = pdfFile.name;
      document.getElementById('pdfSize').textContent = (pdfFile.size/1024).toFixed(0) + ' KB';
      document.getElementById('pdfMsg').textContent = '';
      document.getElementById('pdfModal').classList.add('show');
      note('PDF diterima: '+pdfFile.name+' ('+pdfFile.size+' byte)');
    }catch(e){ note('PDF gagal ditampilkan: '+e.message); }
  }
  document.getElementById('pdfClose').addEventListener('click', function(){ document.getElementById('pdfModal').classList.remove('show'); });
  document.getElementById('pdfShare').addEventListener('click', function(){
    var msg = document.getElementById('pdfMsg'); msg.textContent = '';
    if(!pdfFile) return;
    if(navigator.canShare && navigator.canShare({files:[pdfFile]})){
      navigator.share({files:[pdfFile], title: pdfFile.name}).catch(function(e){ if(e && e.name!=='AbortError') msg.textContent = 'Bagikan gagal: '+(e.message||e)+'. Coba Buka PDF.'; });
    } else { msg.textContent = 'Perangkat ini tidak mendukung Bagikan. Pakai Buka PDF.'; }
  });
  document.getElementById('pdfOpen').addEventListener('click', function(){
    if(!pdfFile) return;
    var url = URL.createObjectURL(pdfFile), w2 = window.open(url, '_blank');
    if(!w2) location.href = url;
  });

  /* ---- pesan dari aplikasi (di dalam iframe Google Apps Script) ---- */
  function trustedOrigin(o){ return /^https:\/\/([a-z0-9-]+\.)*(googleusercontent\.com|google\.com)$/.test(o); }
  window.addEventListener('message', function(e){
    var d = e.data;
    if(!d || d.source!=='ppicapp' || !trustedOrigin(e.origin)) return;
    if(d.type==='pdf'){ showPdf(d); return; }
    if(d.type==='hello'){ sendInit(); note('hello dari aplikasi; token dikirim: '+(getToken()?'ya':'tidak')); return; }
    if(d.type==='token' && typeof d.token==='string' && d.token && d.token.length<4096){ setToken(d.token); note('token disimpan ('+d.token.length+' karakter)'); }
    else if(d.type==='logout'){ clearToken(); note('token dihapus (logout/sesi tidak valid)'); }
  });

  /* ---- muat aplikasi: token dikirim lewat hash (#) sehingga tidak ikut terkirim ke server ---- */
  function appUrl(){
    var p = ['po='+encodeURIComponent(location.origin)];
    try{ p.push('pb='+encodeURIComponent(location.origin+location.pathname.replace(/[^\/]*$/,''))); }catch(e){}
    try{ if((window.navigator && window.navigator.standalone===true) || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)) p.push('sa=1'); }catch(e){}
    var t = getToken();
    if(t) p.push('ppt='+encodeURIComponent(t));
    note('memuat; token tersimpan: '+(t?'ya':'tidak'));
    return EXEC_URL+'?v='+Date.now()+'#'+p.join('&');   // ?v= mencegah cache lama di dalam iframe
  }
  var slowTimer;
  function showSplash(msg){
    splash.classList.remove('hide'); document.getElementById('splashMsg').textContent = msg||'Memuat aplikasi…';
    document.getElementById('hint').style.display='none'; document.getElementById('reloadBtn').style.display='none';
    clearTimeout(slowTimer);
    slowTimer = setTimeout(function(){ document.getElementById('hint').style.display='block'; document.getElementById('reloadBtn').style.display='inline-block'; }, 15000);
  }
  function load(){
    if(!navigator.onLine){ offline.classList.add('show'); return; }
    offline.classList.remove('show'); showSplash();
    frame.src = appUrl();
  }
  frame.addEventListener('load', function(){ setTimeout(sendInit,250); setTimeout(sendInit,1200);  if(frame.src==='' || frame.src==='about:blank') return; clearTimeout(slowTimer); setTimeout(function(){ splash.classList.add('hide'); }, 250); note('halaman aplikasi dimuat'); });
  document.getElementById('reloadBtn').addEventListener('click', load);
  document.getElementById('retryBtn').addEventListener('click', load);
  window.addEventListener('online', function(){ if(offline.classList.contains('show')) load(); });
  window.addEventListener('offline', function(){ note('offline'); });

  if('serviceWorker' in navigator){ window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
  load();
})();
</script>
</body>
</html>
